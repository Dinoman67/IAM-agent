name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker + Container
    # Expose secrets as job-level env vars: `secrets` cannot be referenced
    # directly in `if:` conditionals, but `env` can (GitHub docs). When the
    # repo/fork has no Cloudflare secrets, the deploy step is skipped
    # instead of failing.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler v4 requires Node.js >= 22 (fails on Node 20)
          node-version: 22
          cache: npm

      - name: Install Wrangler deps
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy to Cloudflare Workers + Containers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
